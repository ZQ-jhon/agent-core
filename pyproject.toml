[project]
name = "agent-core"
version = "0.1.0"
description = "Minimal agent loop — no framework, just Python."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
a2ui-http = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]
dev = [
    "fastapi>=0.115.0",
    "jsonschema>=4.23",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "uvicorn>=0.30.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
